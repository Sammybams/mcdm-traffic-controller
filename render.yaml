services:
  - type: web
    name: mcdm-traffic-vision
    runtime: python
    plan: 1c-2g
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r requirements.txt
    startCommand: >-
      uvicorn traffic_vision.api:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
    healthCheckPath: /health
    envVars:
      - key: TRAFFIC_VISION_API_KEY
        sync: false
      - key: TRAFFIC_VISION_MODEL
        value: artifacts/research/toy-vehicle-prelabel.pt
      - key: TRAFFIC_VISION_ROADS_CONFIG
        value: configs/roads.supplied-view-provisional.json
      - key: TRAFFIC_VISION_CONFIDENCE
        value: "0.20"
      - key: TRAFFIC_VISION_MAX_UPLOAD_MB
        value: "10"
