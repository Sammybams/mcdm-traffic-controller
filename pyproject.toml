[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcdm-traffic-vision"
version = "0.1.0"
description = "Vehicle counting, density, and proximity measurements for a tabletop traffic controller"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sammybams" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
vision = [
  "ultralytics>=8.3",
]

[project.scripts]
traffic-vision = "traffic_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

